<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Class Reservation</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Gym Class Reservation</h1>
      <p class="subtitle">Book your spot in a group class — no account needed.</p>
    </header>

    <ol class="stepper" id="stepper" aria-label="Reservation progress"></ol>

    <main class="card" id="app" aria-live="polite"></main>

    <footer class="app-footer">
      <p>Availability updates as reservations are confirmed and resets when this page is reloaded.</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
